<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>框架无关接入 · Rinova Devtools</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        color: #1c2024;
        background: #f4f6f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: radial-gradient(800px 400px at 50% -10%, rgba(47, 111, 235, 0.1), transparent 60%), #f4f6f9;
      }
      main {
        width: min(620px, 100%);
        padding: 28px;
        background: #fff;
        border: 1px solid #e6eaf0;
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        height: 21px;
        padding: 0 8px;
        border-radius: 5px;
        background: #eef3fe;
        color: #2563eb;
        font-size: 10.5px;
        font-weight: 550;
      }
      h1 {
        margin: 12px 0 6px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #5b6673;
        font-size: 12.5px;
        line-height: 1.7;
      }
      code {
        padding: 1px 5px;
        border-radius: 4px;
        background: #eef1f5;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 1px solid #e1e6ec;
        border-radius: 7px;
        background: #fff;
        color: #3d4752;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #f7f8fb;
      }
      button.primary {
        border-color: #2f6feb;
        background: #2f6feb;
        color: #fff;
      }
      .counter {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid #eef1f5;
        border-radius: 9px;
        background: #fafbfd;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .counter strong {
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .counter span {
        color: #8792a0;
        font-size: 11px;
      }
      .hint {
        margin-top: 14px;
        color: #8792a0;
        font-size: 10.5px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">无框架 · 纯 DOM</span>
      <h1>Rinova Devtools 框架无关示例</h1>
      <p>
        这个页面没有 Vue、没有 React，只有 <code>createDevtools()</code> 和原生 DOM。
        面板、网络、存储、日志能力完全一致。
      </p>
      <div class="counter">
        <div>
          <span>计数器</span>
          <strong id="count">0</strong>
        </div>
        <button id="inc">+ 1</button>
      </div>
      <div class="row">
        <button id="open" class="primary">打开调试面板</button>
        <button id="fetch">请求 /api/users</button>
        <button id="log">打一条日志</button>
        <button id="store">写 localStorage</button>
      </div>
      <p class="hint">快捷键 alt + shift + D；右下角悬浮球同样可以打开。</p>
    </main>
    <script type="module" src="/src/vanilla.ts"></script>
  </body>
</html>
